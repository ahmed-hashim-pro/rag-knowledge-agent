[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-agent"
version = "1.1.0"
description = "A CLI RAG agent that answers questions over a local corpus with citations, confidence gating, and prompt-injection defences."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahmed Hashim" }]
keywords = ["rag", "anthropic", "claude", "chromadb", "vector-database", "llm-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic==0.122.0",
    "chromadb==1.5.9",
    "sentence-transformers==5.7.0",
    "pypdf==6.16.1",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[project.urls]
Homepage = "https://github.com/ahmed-hashim-pro/rag-knowledge-agent"
Repository = "https://github.com/ahmed-hashim-pro/rag-knowledge-agent"

[project.scripts]
rag = "rag_agent.cli:main"

[tool.setuptools.packages.find]
include = ["rag_agent*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
